  <style>
    /* Atlassian Design System Theme & Custom ERP Styles */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

:root {
  /* Atlassian Color Palette */
  --ds-background-neutral: #F4F5F7;
  --ds-background-neutral-subtle: #FAFBFC;
  --ds-background-neutral-hover: #EBECF0;
  --ds-background-neutral-active: #DFE1E6;
  
  --ds-surface: #FFFFFF;
  --ds-surface-overlay: #FFFFFF;
  --ds-surface-raised: #FFFFFF;
  --ds-surface-sunken: #F4F5F7;
  
  --ds-text: #172B4D;
  --ds-text-subtle: #42526E;
  --ds-text-subtlest: #6B778C;
  --ds-text-inverse: #FFFFFF;
  
  --ds-border: #DFE1E6;
  --ds-border-subtle: #EBECF0;
  --ds-border-bold: #7A869A;
  --ds-border-focused: #4C9AFF;
  
  /* Brand & Status Colors */
  --ds-brand-primary: #0052CC;
  --ds-brand-primary-hover: #0747A6;
  --ds-brand-primary-active: #00388B;
  --ds-brand-subtle: #DEEBFF;
  
  --ds-success: #36B37E;
  --ds-success-subtle: #E3FCEF;
  --ds-success-text: #006644;
  
  --ds-warning: #FFAB00;
  --ds-warning-subtle: #FFF0B3;
  --ds-warning-text: #172B4D;
  
  --ds-danger: #FF5630;
  --ds-danger-subtle: #FFEBE6;
  --ds-danger-text: #BF2600;
  
  --ds-info: #00B8D9;
  --ds-info-subtle: #E6FCFF;
  --ds-info-text: #008DA6;
  
  --ds-purple: #6554C0;
  --ds-purple-subtle: #EAE6FF;
  --ds-purple-text: #403294;
}

*, *::before, *::after, body, button, input, select, textarea, kbd, code, pre, table, . {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
}

body {
  color: var(--ds-text);
  background-color: var(--ds-background-neutral);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Custom Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: #F4F5F7;
}
::-webkit-scrollbar-thumb {
  background: #C1C7D0;
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: #A5ADBA;
}

/* Atlassian Lozenge (Badge) Styles */
.lozenge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  font-size: 11px;
  font-weight: 700;
  line-height: 14px;
  text-transform: uppercase;
  border-radius: 3px;
  letter-spacing: 0.04em;
}

.lozenge-default {
  background-color: var(--ds-background-neutral-hover);
  color: var(--ds-text-subtle);
}

.lozenge-success {
  background-color: var(--ds-success-subtle);
  color: var(--ds-success-text);
}

.lozenge-inprogress {
  background-color: var(--ds-brand-subtle);
  color: var(--ds-brand-primary);
}

.lozenge-warning {
  background-color: var(--ds-warning-subtle);
  color: #8f4d00;
}

.lozenge-danger {
  background-color: var(--ds-danger-subtle);
  color: var(--ds-danger-text);
}

.lozenge-info {
  background-color: var(--ds-info-subtle);
  color: var(--ds-info-text);
}

.lozenge-purple {
  background-color: var(--ds-purple-subtle);
  color: var(--ds-purple-text);
}

/* Atlassian Button Styles */
.btn-primary {
  background-color: var(--ds-brand-primary);
  color: #ffffff;
  font-weight: 500;
  transition: background-color 0.15s ease;
}
.btn-primary:hover {
  background-color: var(--ds-brand-primary-hover);
}
.btn-primary:active {
  background-color: var(--ds-brand-primary-active);
}

.btn-subtle {
  background-color: transparent;
  color: var(--ds-text-subtle);
  font-weight: 500;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.btn-subtle:hover {
  background-color: var(--ds-background-neutral-hover);
  color: var(--ds-text);
}

.btn-secondary {
  background-color: #091E420A;
  color: var(--ds-text);
  font-weight: 500;
  border: 1px solid var(--ds-border);
}
.btn-secondary:hover {
  background-color: #091E4214;
}

.btn-danger {
  background-color: var(--ds-danger);
  color: #ffffff;
}
.btn-danger:hover {
  background-color: #DE350B;
}

/* Table styling */
.erp-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
}
.erp-table th {
  background-color: #FAFBFC;
  color: #5E6C84;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 10px 14px;
  border-bottom: 2px solid #DFE1E6;
  position: sticky;
  top: 0;
  z-index: 10;
  white-space: nowrap;
}
.erp-table td {
  padding: 10px 14px;
  font-size: 13px;
  border-bottom: 1px solid #EBECF0;
  color: #172B4D;
  vertical-align: middle;
}
.erp-table tr:hover td {
  background-color: #FAFBFC;
}

/* Fixed Sticky Actions Column across all tables */
.erp-table .sticky-action-col {
  position: sticky !important;
  right: 0 !important;
  background-clip: padding-box;
}
.erp-table th.sticky-action-col {
  background-color: #FAFBFC !important;
  z-index: 20 !important;
  border-left: 1px solid #DFE1E6;
  box-shadow: -4px 0 6px -2px rgba(9, 30, 66, 0.08);
}
.erp-table td.sticky-action-col {
  background-color: #ffffff;
  z-index: 10 !important;
  border-left: 1px solid #EBECF0;
  box-shadow: -4px 0 6px -2px rgba(9, 30, 66, 0.08);
}
.erp-table tr:hover td.sticky-action-col {
  background-color: #FAFBFC !important;
}
.erp-table tr.bg-\[\#F4F5F7\] td.sticky-action-col {
  background-color: #F4F5F7 !important;
}

/* Nav Item Active */
.nav-item-active {
  background-color: #DEEBFF !important;
  color: #0052CC !important;
  font-weight: 600 !important;
}
.nav-item-active svg {
  color: #0052CC !important;
}

/* Tab active */
.tab-active {
  color: #0052CC !important;
  border-bottom: 2px solid #0052CC !important;
  font-weight: 600 !important;
}

/* Drawer & Modal Transitions */
.drawer-backdrop {
  background-color: rgba(9, 30, 66, 0.54);
  backdrop-filter: blur(2px);
  transition: opacity 0.25s ease;
}

.drawer-panel {
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Traceability Flow Step */
.trace-step-node {
  position: relative;
  z-index: 1;
}
.trace-step-node::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 100%;
  width: 32px;
  height: 2px;
  background-color: #DFE1E6;
  z-index: 0;
}
.trace-step-node:last-child::after {
  display: none;
}

/* Coldstore Rack Grid */
.rack-slot {
  aspect-ratio: 1;
  border-radius: 4px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.rack-slot:hover {
  transform: scale(1.06);
  box-shadow: 0 4px 8px rgba(9, 30, 66, 0.15);
  z-index: 2;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.animate-fade-in {
  animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Skeleton Shimmer Animation */
@keyframes skeletonShimmer {
  0% {
    background-position: -200% 0;
  }
  100% {
    background-position: 200% 0;
  }
}

.skeleton-shimmer {
  background: linear-gradient(
    90deg,
    #EBECF0 0%,
    #F4F5F7 25%,
    #EBECF0 50%,
    #EBECF0 100%
  );
  background-size: 200% 100%;
  animation: skeletonShimmer 1.5s ease-in-out infinite;
}

/* Print Styles */
@media print {
  aside, header, .no-print {
    display: none !important;
  }
  main {
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
  }
}

  </style>
</head>

  // Components
  // Atlassian Design System Toast Notifications

const Toast = {
  container: null,

  init() {
    if (!this.container) {
      this.container = document.createElement('div');
      this.container.id = 'erp-toast-container';
      this.container.className = 'fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-md w-full pointer-events-none';
      document.body.appendChild(this.container);
    }
  },

  show(message, type = 'info', title = null, duration = 4000) {
    this.init();

    const toastId = 'toast-' + Math.random().toString(36).substr(2, 9);
    const toast = document.createElement('div');
    toast.id = toastId;
    toast.className = 'pointer-events-auto bg-white rounded shadow-lg border border-[#DFE1E6] p-3.5 flex items-start gap-3 transform transition-all duration-300 translate-y-4 opacity-0 text-sm animate-fade-in';

    let iconSvg = '';
    let accentBorder = 'border-l-4 border-[#0052CC]';

    if (type === 'success') {
      accentBorder = 'border-l-4 border-[#36B37E]';
      iconSvg = `<svg class="w-5 h-5 text-[#36B37E] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>`;
      if (!title) title = 'Success';
    } else if (type === 'danger' || type === 'error') {
      accentBorder = 'border-l-4 border-[#FF5630]';
      iconSvg = `<svg class="w-5 h-5 text-[#FF5630] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
      if (!title) title = 'Attention Required';
    } else if (type === 'warning') {
      accentBorder = 'border-l-4 border-[#FFAB00]';
      iconSvg = `<svg class="w-5 h-5 text-[#FFAB00] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>`;
      if (!title) title = 'Warning';
    } else {
      iconSvg = `<svg class="w-5 h-5 text-[#0052CC] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>`;
      if (!title) title = 'Information';
    }

    toast.className += ` ${accentBorder}`;
    toast.innerHTML = `
      ${iconSvg}
      <div class="flex-1 pr-2">
        <div class="font-semibold text-[#172B4D] text-xs uppercase tracking-wider">${title}</div>
        <div class="text-[#42526E] text-xs mt-0.5">${message}</div>
      </div>
      <button class="text-[#6B778C] hover:text-[#172B4D] p-1 rounded transition-colors" onclick="document.getElementById('${toastId}').remove()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    `;

    this.container.appendChild(toast);

    setTimeout(() => {
      toast.classList.remove('translate-y-4', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
    }, 10);

    setTimeout(() => {
      if (toast.parentNode) {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }
    }, duration);
  }
};

    const sizeClasses = {

        ? 'btn-danger px-4 py-2 rounded text-sm font-medium'
        : 'btn-secondary px-4 py-2 rounded text-sm';
      buttonsHtml += `<button id="modal-btn-${idx}" class="${cls}">${btn.label}</button>`;
    });

    modalEl.innerHTML = `

        </div>

        <!-- Modal Body -->
        <div class="p-6 overflow-y-auto flex-1 text-sm text-[#172B4D]">
          ${content}

          ${buttonsHtml}
        </div>
      </div>
    `;

    document.body.appendChild(modalEl);
    this.activeModal = modalEl;

    // Attach Close Handler
    modalEl.querySelector('#erp-modal-close-btn').addEventListener('click', () => this.close());
    modalEl.addEventListener('click', (e) => {
      if (e.target === modalEl) this.close();
    });

    // Attach Footer Handlers
    footerButtons.forEach((btn, idx) => {
      const btnEl = modalEl.querySelector(`#modal-btn-${idx}`);
      if (btnEl && btn.onClick) {
        btnEl.addEventListener('click', () => btn.onClick(this));
      }
    });

    // Keydown escape
    const escHandler = (e) => {
      if (e.key === 'Escape') {
        this.close();
        document.removeEventListener('keydown', escHandler);
      }
    };
    document.addEventListener('keydown', escHandler);

    const existing = document.getElementById('erp-modal-root');
    if (existing) existing.remove();
    this.activeModal = null;
  },

    this.closeDrawer();

    drawerEl.id = 'erp-drawer-root';
    drawerEl.className = 'fixed inset-0 z-50 flex justify-end drawer-backdrop';

    `;

    document.body.appendChild(drawerEl);
    setTimeout(() => {
      const panel = drawerEl.querySelector('.drawer-panel');
      if (panel) panel.classList.remove('translate-x-full');
    }, 10);

    drawerEl.querySelector('#erp-drawer-close-btn').addEventListener('click', () => this.closeDrawer());
    drawerEl.addEventListener('click', (e) => {
      if (e.target === drawerEl) this.closeDrawer();

  },

  closeDrawer() {
    const existing = document.getElementById('erp-drawer-root');
    if (existing) {
      const panel = existing.querySelector('.drawer-panel');
      if (panel) panel.classList.add('translate-x-full');
      setTimeout(() => existing.remove(), 250);
    }
  },

  // Confirmation Dialog
  confirm({ title = 'Confirm Action', message, confirmText = 'Confirm', cancelText = 'Cancel', isDestructive = false, onConfirm }) {
    this.open({
      title,
      content: `<div class="py-2 text-[#42526E]">${message}</div>`,
      footerButtons: [

          onClick: (modal) => {

            if (onConfirm) onConfirm();

      ]
    });

  // Action Success / Submitted / Saved / Edited Confirmation Popup

        </div>
      `;
    }

    modalEl.innerHTML = `
      <div class="bg-white rounded-xl shadow-2xl border border-[#DFE1E6] w-full max-w-md flex flex-col animate-fade-in overflow-hidden text-center p-6">
        <div class="w-12 h-12 rounded-full bg-[#E3FCEF] text-[#006644] mx-auto flex items-center justify-center mb-3 shadow-xs">

        </div>
        
        <h3 class="text-base font-extrabold text-[#172B4D] mb-1.5">${title}</h3>
        <p class="text-xs text-[#5E6C84] leading-relaxed">${message}</p>
        
        ${detailsHtml}

        <div class="mt-5 flex justify-center">
          <button id="modal-success-btn" class="btn-primary w-full py-2 rounded-lg text-xs font-bold shadow-xs hover:shadow cursor-pointer">
            ${buttonText}
          </button>
        </div>
      </div>
    `;

    document.body.appendChild(modalEl);
    this.activeModal = modalEl;

    const btn = modalEl.querySelector('#modal-success-btn');
    if (btn) {
      btn.addEventListener('click', () => {
        this.close();
        if (onConfirm) onConfirm();
      });
    }

    modalEl.addEventListener('click', (e) => {
      if (e.target === modalEl) this.close();
    });
  }
};

class DataTable {
  constructor({
    containerId,
    columns,
    data,

    pageSize = 10,
    searchable = true,
    filterable = true,
    selectable = true,
    actions = [],
    bulkActions = [],
    exportable = true,
    tableTitle = '',
    topFilterTitle = '',
    hideTopFilterBar = false,
    onRowClick = null
  }) {
    this.container = typeof containerId === 'string' ? document.getElementById(containerId) : containerId;
    this.columns = columns;
    this.originalData = [...data];
    this.filteredData = [...data];
    this.keyField = keyField;
    this.pageSize = pageSize;
    this.currentPage = 1;
    this.searchable = searchable;
    this.filterable = filterable;
    this.selectable = selectable;
    this.actions = actions;
    this.bulkActions = bulkActions;
    this.exportable = exportable;
    this.tableTitle = tableTitle;
    this.topFilterTitle = topFilterTitle || tableTitle || 'DATA EXPLORER & RECORDS';
    this.hideTopFilterBar = hideTopFilterBar;
    this.isFilterCollapsed = false;
    this.onRowClick = onRowClick;
    
    this.searchTerm = '';
    this.activeFilters = {};
    this.topFilters = {
      species: 'ALL',
      center: 'ALL',
      plant: 'ALL'
    };
    this.sortColumn = null;
    this.sortDirection = 'asc';
    this.selectedKeys = new Set();
    this.hiddenColumns = new Set();

    this.render();
  }

  getVisibleColumns() {
    return this.columns.filter(c => !this.hiddenColumns.has(c.field));
  }

  setData(newData) {
    this.originalData = [...newData];
    this.applyFilters();
  }

  applyFilters() {
    let result = [...this.originalData];

    // Global Search
    if (this.searchTerm.trim() !== '') {
      const term = this.searchTerm.toLowerCase();
      result = result.filter(item => {
        return Object.values(item).some(val => {
          if (val === null || val === undefined) return false;
          return String(val).toLowerCase().includes(term);
        });
      });
    }

    // Top Filter Bar Species / Center / Plant (soft match if fields exist)
    if (this.topFilters) {
      if (this.topFilters.species && this.topFilters.species !== 'ALL') {
        const sp = this.topFilters.species.toLowerCase();
        result = result.filter(item => {
          const itemSpecies = String(item.species || item.speciesName || item.variety || '').toLowerCase();
          return !itemSpecies || itemSpecies.includes(sp);
        });
      }
      if (this.topFilters.center && this.topFilters.center !== 'ALL') {
        const ct = this.topFilters.center.toLowerCase();
        result = result.filter(item => {
          const itemCenter = String(item.center || item.centerName || item.landingSource || item.pond || '').toLowerCase();
          return !itemCenter || itemCenter.includes(ct);
        });
      }
      if (this.topFilters.plant && this.topFilters.plant !== 'ALL') {
        const pl = this.topFilters.plant.toLowerCase();
        result = result.filter(item => {
          const itemPlant = String(item.plant || item.currentLocation || '').toLowerCase();
          return !itemPlant || itemPlant.includes(pl);
        });
      }
    }

    // Column / Custom Filters
    Object.keys(this.activeFilters).forEach(key => {
      const filterVal = this.activeFilters[key];
      if (filterVal && filterVal !== 'ALL') {
        result = result.filter(item => String(item[key]) === String(filterVal));
      }
    });

    // Sorting
    if (this.sortColumn) {
      const col = this.sortColumn;
      const dir = this.sortDirection === 'asc' ? 1 : -1;
      result.sort((a, b) => {
        let valA = a[col];
        let valB = b[col];
        if (typeof valA === 'number' && typeof valB === 'number') {
          return (valA - valB) * dir;
        }
        return String(valA || '').localeCompare(String(valB || '')) * dir;
      });
    }

    this.filteredData = result;
    this.currentPage = 1;
    this.renderTableBody();
    this.renderPagination();
  }

          <div id="dt-bulk-bar" class="hidden px-4 py-2 bg-[#DEEBFF] border-b border-[#B3D4FF] items-center justify-between text-xs text-[#0747A6]">
            <span id="dt-selected-count">0 items selected</span>
            <div id="dt-bulk-actions" class="flex items-center gap-2"></div>
          </div>

          <!-- Table Container -->
          <div class="overflow-x-auto min-h-[220px]">
            <table class="erp-table">
              <thead>
                <tr id="dt-thead-row"></tr>
              </thead>
              <tbody id="dt-tbody"></tbody>
            </table>
          </div>

          <!-- Pagination Toolbar -->
          <div class="p-3 border-t border-[#DFE1E6] bg-[#FAFBFC] flex items-center justify-between text-xs text-[#5E6C84]" id="dt-pagination-container">
          </div>
        </div>
      </div>
    `;

    this.renderHeader();
    this.renderTableBody();
    this.renderPagination();
    this.bindEvents();
  }

  renderHeader() {
    const theadRow = this.container.querySelector('#dt-thead-row');
    if (!theadRow) return;

    const visibleCols = this.getVisibleColumns();
    let html = '';
    if (this.selectable) {
      html += `
        <th class="w-10 text-center">
          <input type="checkbox" id="dt-select-all-checkbox" class="rounded border-[#DFE1E6] text-[#0052CC] focus:ring-0 cursor-pointer" />
        </th>
      `;
    }

    visibleCols.forEach(col => {
      const isSorted = this.sortColumn === col.field;
      const sortIcon = isSorted 
        ? (this.sortDirection === 'asc' ? '↑' : '↓')
        : '';
      
      const sortClass = col.sortable !== false ? 'cursor-pointer hover:bg-[#EBECF0] transition-colors select-none' : '';
      html += `
        <th data-field="${col.field}" class="${sortClass}">
          <div class="flex items-center gap-1.5">
            <span>${col.header}</span>
            <span class="text-xs text-[#0052CC] font-bold">${sortIcon}</span>
          </div>
        </th>
      `;
    });

    if (this.actions.length > 0) {
      html += `<th class="text-right w-24 sticky-action-col">Actions</th>`;
    }

    theadRow.innerHTML = html;
  }

  renderTableBody() {
    const tbody = this.container.querySelector('#dt-tbody');
    if (!tbody) return;

    const visibleCols = this.getVisibleColumns();

    if (this.filteredData.length === 0) {
      const colSpan = visibleCols.length + (this.selectable ? 1 : 0) + (this.actions.length > 0 ? 1 : 0);
      tbody.innerHTML = `
        <tr>
          <td colspan="${colSpan}" class="text-center py-12 text-[#6B778C]">
            <div class="flex flex-col items-center justify-center gap-2">
              <svg class="w-8 h-8 text-[#A5ADBA]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
              <span class="font-medium">No matching records found</span>
              <span class="text-xs text-[#8993A4]">Try adjusting your search or active filters</span>
            </div>
          </td>
        </tr>
      `;
      return;
    }

    const startIdx = (this.currentPage - 1) * this.pageSize;
    const endIdx = startIdx + this.pageSize;
    const pageItems = this.filteredData.slice(startIdx, endIdx);

    let rowsHtml = '';
    pageItems.forEach((row, idx) => {
      const keyVal = row[this.keyField] || `row-${idx}`;
      const isSelected = this.selectedKeys.has(keyVal);

      rowsHtml += `<tr data-key="${keyVal}" class="${isSelected ? 'bg-[#F4F5F7]' : ''} ${this.onRowClick ? 'cursor-pointer hover:bg-[#FAFBFC]' : ''}">`;

      if (this.selectable) {
        rowsHtml += `
          <td class="text-center">
            <input type="checkbox" data-key="${keyVal}" class="dt-row-checkbox rounded border-[#DFE1E6] text-[#0052CC] focus:ring-0 cursor-pointer" ${isSelected ? 'checked' : ''} />
          </td>
        `;
      }

      visibleCols.forEach(col => {
        let cellVal = row[col.field];
        let content = cellVal !== undefined && cellVal !== null ? cellVal : '-';

        if (col.render) {
          content = col.render(cellVal, row, startIdx + idx);
        } else if (col.type === 'status' || col.field.toLowerCase().includes('status')) {
          content = this.renderStatusLozenge(cellVal);
        }

        rowsHtml += `<td>${content}</td>`;
      });

      if (this.actions.length > 0) {
        rowsHtml += `<td class="text-right whitespace-nowrap sticky-action-col">`;
        this.actions.forEach((act, actIdx) => {
          rowsHtml += `
            <button data-action-idx="${actIdx}" data-key="${keyVal}" class="dt-action-btn p-1 text-[#5E6C84] hover:text-[#0052CC] hover:bg-[#EBECF0] rounded text-xs font-medium mr-1 transition-colors" title="${act.label}">
              ${act.icon || act.label}
            </button>
          `;
        });
        rowsHtml += `</td>`;
      }

      rowsHtml += `</tr>`;
    });

    tbody.innerHTML = rowsHtml;
    this.bindRowEvents();
  }

  renderStatusLozenge(status) {
    if (!status) return '-';
    const s = String(status).toUpperCase();
    let cls = 'lozenge-default';

    if (s.includes('PASS') || s.includes('ACTIVE') || s.includes('CLEARED') || s.includes('COMPLETED') || s.includes('OPTIMAL') || s.includes('ISSUED') || s.includes('PAID') || s.includes('FULFILLED') || s.includes('CONFIRMED')) {
      cls = 'lozenge-success';
    } else if (s.includes('PEND') || s.includes('TEST') || s.includes('IN_PROGRESS') || s.includes('STAGE') || s.includes('PARTIAL') || s.includes('PROCESSING') || s.includes('POSTED')) {
      cls = 'lozenge-inprogress';
    } else if (s.includes('HOLD') || s.includes('WARN') || s.includes('PROVISION')) {
      cls = 'lozenge-warning';
    } else if (s.includes('REJECT') || s.includes('FAIL') || s.includes('CANCEL') || s.includes('BLOCK')) {
      cls = 'lozenge-danger';
    }

    return `<span class="lozenge ${cls}">${status.replace(/_/g, ' ')}</span>`;
  }

  renderPagination() {
    const pagContainer = this.container.querySelector('#dt-pagination-container');
    if (!pagContainer) return;

    const totalPages = Math.ceil(this.filteredData.length / this.pageSize) || 1;
    const startRecord = this.filteredData.length > 0 ? (this.currentPage - 1) * this.pageSize + 1 : 0;
    const endRecord = Math.min(this.currentPage * this.pageSize, this.filteredData.length);

    pagContainer.innerHTML = `
      <div>
        Showing <span class="font-semibold text-[#172B4D]">${startRecord}</span> to <span class="font-semibold text-[#172B4D]">${endRecord}</span> of <span class="font-semibold text-[#172B4D]">${this.filteredData.length}</span> entries
      </div>
      <div class="flex items-center gap-2">
        <button id="dt-page-prev" class="btn-secondary px-2.5 py-1 rounded text-xs ${this.currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''}">Previous</button>
        <span class="font-medium text-[#172B4D]">Page ${this.currentPage} of ${totalPages}</span>
        <button id="dt-page-next" class="btn-secondary px-2.5 py-1 rounded text-xs ${this.currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''}">Next</button>
      </div>
    `;

    pagContainer.querySelector('#dt-page-prev').addEventListener('click', () => {
      if (this.currentPage > 1) {
        this.currentPage--;
        this.renderTableBody();
        this.renderPagination();
      }
    });

    pagContainer.querySelector('#dt-page-next').addEventListener('click', () => {
      if (this.currentPage < totalPages) {
        this.currentPage++;
        this.renderTableBody();
        this.renderPagination();
      }
    });
  }

  bindEvents() {
    // Top Filter Bar Toggle Open / Close
    const toggleBtn = this.container.querySelector('.dt-top-filter-toggle-btn');
    const filterBody = this.container.querySelector('.dt-top-filter-body');
    const toggleIcon = this.container.querySelector('.dt-top-filter-toggle-icon');
    const toggleText = this.container.querySelector('.dt-top-filter-toggle-text');

    if (toggleBtn && filterBody) {
      toggleBtn.addEventListener('click', () => {
        this.isFilterCollapsed = !this.isFilterCollapsed;
        if (this.isFilterCollapsed) {
          filterBody.classList.add('hidden');
          if (toggleText) toggleText.innerText = 'Show Filter';
          if (toggleIcon) toggleIcon.classList.add('-rotate-90');
          toggleBtn.classList.remove('bg-[#DEEBFF]/80', 'text-[#0052CC]', 'border-[#B3D4FF]');
          toggleBtn.classList.add('bg-[#FAFBFC]', 'text-[#5E6C84]', 'border-[#DFE1E6]');
        } else {
          filterBody.classList.remove('hidden');
          if (toggleText) toggleText.innerText = 'Hide Filter';
          if (toggleIcon) toggleIcon.classList.remove('-rotate-90');
          toggleBtn.classList.add('bg-[#DEEBFF]/80', 'text-[#0052CC]', 'border-[#B3D4FF]');
          toggleBtn.classList.remove('bg-[#FAFBFC]', 'text-[#5E6C84]', 'border-[#DFE1E6]');
        }
      });
    }

    // Top Filter Bar Reset Button
    const resetBtn = this.container.querySelector('.dt-top-filter-reset-btn');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        const speciesSel = this.container.querySelector('.dt-top-species-select');
        const centerSel = this.container.querySelector('.dt-top-center-select');
        const plantSel = this.container.querySelector('.dt-top-plant-select');
        if (speciesSel) speciesSel.value = 'ALL';
        if (centerSel) centerSel.value = 'ALL';
        if (plantSel) plantSel.value = 'ALL';

        this.topFilters.species = 'ALL';
        this.topFilters.center = 'ALL';
        this.topFilters.plant = 'ALL';

        this.applyFilters();
        Toast.show('Filters have been reset.', 'info');
      });
    }

    // Top Filter Bar Search Button
    const topSearchBtn = this.container.querySelector('.dt-top-filter-search-btn');
    if (topSearchBtn) {
      topSearchBtn.addEventListener('click', () => {
        const speciesSel = this.container.querySelector('.dt-top-species-select');
        const centerSel = this.container.querySelector('.dt-top-center-select');
        const plantSel = this.container.querySelector('.dt-top-plant-select');

        this.topFilters.species = speciesSel ? speciesSel.value : 'ALL';
        this.topFilters.center = centerSel ? centerSel.value : 'ALL';
        this.topFilters.plant = plantSel ? plantSel.value : 'ALL';

        this.applyFilters();
        Toast.show(`Filtered records: ${this.filteredData.length} entries matching search criteria.`, 'info');
      });
    }

    // In-Table Live Search
    const searchInput = this.container.querySelector('#dt-search-input');
    if (searchInput) {
      searchInput.addEventListener('input', (e) => {
        this.searchTerm = e.target.value;
        this.applyFilters();
      });
    }

    // Select All Rows Checkbox
    const selectAllBox = this.container.querySelector('#dt-select-all-checkbox');
    if (selectAllBox) {
      selectAllBox.addEventListener('change', (e) => {
        const isChecked = e.target.checked;
        this.selectedKeys.clear();
        if (isChecked) {
          this.filteredData.forEach((row, idx) => {
            const key = row[this.keyField] || `row-${idx}`;
            this.selectedKeys.add(key);
          });
        }
        this.renderTableBody();
        this.updateBulkBar();
      });
    }

    // Columns Dropdown Toggle
    const colsBtn = this.container.querySelector('#dt-columns-btn');
    const colsDropdown = this.container.querySelector('#dt-columns-dropdown');
    if (colsBtn && colsDropdown) {
      colsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        colsDropdown.classList.toggle('hidden');
      });

      document.addEventListener('click', (e) => {
        if (!colsDropdown.contains(e.target) && e.target !== colsBtn && !colsBtn.contains(e.target)) {
          colsDropdown.classList.add('hidden');
        }
      });
    }

    // Column Checkboxes Toggle
    const colBoxes = this.container.querySelectorAll('.dt-col-toggle-checkbox');
    colBoxes.forEach(cb => {
      cb.addEventListener('change', (e) => {
        const field = cb.dataset.field;
        if (e.target.checked) {
          this.hiddenColumns.delete(field);
        } else {
          // Keep at least 1 column visible
          if (this.getVisibleColumns().length <= 1) {
            e.target.checked = true;
            return;
          }
          this.hiddenColumns.add(field);
        }
        this.renderHeader();
        this.renderTableBody();
      });
    });

    // Reset / Show All Columns Button
    const resetColsBtn = this.container.querySelector('#dt-cols-reset-btn');
    if (resetColsBtn) {
      resetColsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        this.hiddenColumns.clear();
        this.container.querySelectorAll('.dt-col-toggle-checkbox').forEach(cb => {
          cb.checked = true;
        });
        this.renderHeader();
        this.renderTableBody();
      });
    }

    const copyBtn = this.container.querySelector('#dt-copy-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        const visibleCols = this.getVisibleColumns();
        const headers = visibleCols.map(c => c.header).join('\t');
        const rows = this.filteredData.map(r => visibleCols.map(c => {
          let v = r[c.field];
          return v !== undefined && v !== null ? String(v) : '';
        }).join('\t')).join('\n');
        
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(headers + '\n' + rows).then(() => {
            Toast.show('Table records copied to clipboard', 'success');
          }).catch(() => {
            Toast.show('Table copied to clipboard', 'info');
          });
        } else {
          Toast.show('Table copied to clipboard', 'info');
        }
      });
    }

    const exportBtn = this.container.querySelector('#dt-export-btn');
    if (exportBtn) {
      exportBtn.addEventListener('click', () => this.exportToCSV());
    }

    const pdfBtn = this.container.querySelector('#dt-pdf-btn');
    if (pdfBtn) {
      pdfBtn.addEventListener('click', () => {
        Toast.show('Preparing printable document format...', 'info');
        window.print();
      });
    }

    // Delegated Sort Click Header
    const theadRow = this.container.querySelector('#dt-thead-row');
    if (theadRow) {
      theadRow.addEventListener('click', (e) => {
        const th = e.target.closest('th[data-field]');
        if (!th) return;
        const field = th.dataset.field;
        if (this.sortColumn === field) {
          this.sortDirection = this.sortDirection === 'asc' ? 'desc' : 'asc';
        } else {
          this.sortColumn = field;
          this.sortDirection = 'asc';
        }
        this.renderHeader();
        this.applyFilters();
      });
    }
  }

  bindRowEvents() {
    const rowBoxes = this.container.querySelectorAll('.dt-row-checkbox');
    rowBoxes.forEach(box => {
      box.addEventListener('change', (e) => {
        const key = box.dataset.key;
        if (e.target.checked) {
          this.selectedKeys.add(key);
        } else {
          this.selectedKeys.delete(key);
        }
        this.updateBulkBar();
      });
    });

    const actionBtns = this.container.querySelectorAll('.dt-action-btn');
    actionBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const actIdx = parseInt(btn.dataset.actionIdx, 10);
        const key = btn.dataset.key;
        const row = this.originalData.find((r, i) => (r[this.keyField] || `row-${i}`) === key);
        if (this.actions[actIdx] && this.actions[actIdx].onClick) {
          this.actions[actIdx].onClick(row, this);
        }
      });
    });

    if (this.onRowClick) {
      const rows = this.container.querySelectorAll('#dt-tbody tr[data-key]');
      rows.forEach(tr => {
        tr.addEventListener('click', (e) => {
          if (e.target.tagName === 'INPUT' || e.target.closest('button')) return;
          const key = tr.dataset.key;
          const row = this.originalData.find((r, i) => (r[this.keyField] || `row-${i}`) === key);
          this.onRowClick(row, this);
        });
      });
    }
  }

  updateBulkBar() {
    const bulkBar = this.container.querySelector('#dt-bulk-bar');
    const selectedCount = this.container.querySelector('#dt-selected-count');
    if (!bulkBar) return;

    if (this.selectedKeys.size > 0) {
      bulkBar.classList.remove('hidden');
      bulkBar.classList.add('flex');
      selectedCount.innerText = `${this.selectedKeys.size} items selected`;
    } else {
      bulkBar.classList.add('hidden');
      bulkBar.classList.remove('flex');
    }
  }

  exportToCSV() {
    if (this.filteredData.length === 0) return;

    const headers = this.columns.map(c => `"${c.header}"`).join(',');
    const rows = this.filteredData.map(row => {
      return this.columns.map(c => {
        let val = row[c.field];
        if (val === undefined || val === null) val = '';
        return `"${String(val).replace(/"/g, '""')}"`;
      }).join(',');
    });

    const csvContent = 'data:text/csv;charset=utf-8,' + [headers, ...rows].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', `${(this.tableTitle || 'export').toLowerCase().replace(/\s+/g, '_')}_${Date.now()}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
}

  // Dynamic Breadcrumb Navigation Component for Main Menu -> Sub Menu -> Tab



const Breadcrumbs = {
  render(containerId, activeHash, customLeaf = null) {
    const container = document.getElementById(containerId);
    if (!container) return;

    let crumbs = [];

    const clean = (activeHash || '').replace(/^#\/?/, '').replace(/^\/+/, '');
    const parts = clean.split('/');
    const modId = parts[0] || 'purchase';
    const subId = parts[1] || 'dashboard';
    const tabId = parts[2] || '';

    const module = NAV_HIERARCHY.find(m => m.id === modId);
    if (module) {
      const defaultModHash = module.submenus[0]?.tabs[0]?.hash || `/${modId}`;
      crumbs.push({ label: module.title, hash: defaultModHash });

      const submenu = module.submenus.find(s => s.id === subId);
      if (submenu) {
        const defaultSubHash = submenu.tabs[0]?.hash || `/${modId}/${subId}`;
        crumbs.push({ label: submenu.title, hash: defaultSubHash });

        const tab = submenu.tabs.find(t => t.id === tabId);
        if (tab) {
          crumbs.push({ label: tab.label, hash: tab.hash, active: !customLeaf });
        }
      }
    }

    if (customLeaf) {
      crumbs.push({ label: customLeaf, hash: null, active: true });
    }

    const html = `
      <nav class="flex items-center gap-1.5 text-xs text-[#5E6C84] py-1 select-none flex-wrap" aria-label="Breadcrumb">
        ${crumbs.map((c, idx) => {
          const isLast = idx === crumbs.length - 1;
          const separator = !isLast ? `<span class="text-[#8993A4] text-[10px]">/</span>` : '';
          
          if (c.active || isLast || !c.hash) {
            return `<span class="font-semibold text-[#172B4D] truncate max-w-xs">${c.label}</span> ${separator}`;
          } else {
            return `<a href="${c.hash}" class="hover:text-[#0052CC] hover:underline transition-colors truncate max-w-xs">${c.label}</a> ${separator}`;
          }
        }).join('')}
      </nav>
    `;

    container.innerHTML = html;
  }
};

  renderStep(index) {
    if (index < 0 || index >= this.steps.length) {
      this.finish();
      return;
    }

    this.currentStep = index;
    const step = this.steps[index];
    const targetEl = typeof step.target === 'function' ? step.target() : step.target;

    const popover = document.getElementById('tour-popover-card');
    const badgeEl = document.getElementById('tour-step-badge');
    const titleEl = document.getElementById('tour-step-title');
    const contentEl = document.getElementById('tour-step-content');
    const prevBtn = document.getElementById('tour-prev-btn');
    const nextBtnText = document.getElementById('tour-next-text');
    const nextBtnIcon = document.getElementById('tour-next-icon');
    const dotsContainer = document.getElementById('tour-dots-container');

    if (!popover || !badgeEl || !titleEl || !contentEl) return;

    badgeEl.innerText = step.badge;
    titleEl.innerText = step.title;
    contentEl.innerText = step.content;

    // Previous Button
    if (index === 0) {
      prevBtn.style.visibility = 'hidden';
    } else {
      prevBtn.style.visibility = 'visible';
    }

    // Next vs Finish Button
    if (index === this.steps.length - 1) {
      nextBtnText.innerText = 'Finish Tour';
      if (nextBtnIcon) nextBtnIcon.style.display = 'none';
    } else {
      nextBtnText.innerText = 'Next';
      if (nextBtnIcon) nextBtnIcon.style.display = 'inline-block';
    }

    // Interactive Dots
    if (dotsContainer) {
      dotsContainer.innerHTML = this.steps.map((_, i) => `
        <span class="inline-block h-2 rounded-full transition-all cursor-pointer ${i === index ? 'bg-[#0052CC] w-5' : 'bg-[#DFE1E6] hover:bg-[#A5ADBA] w-2'}" data-step-dot="${i}" title="Jump to step ${i + 1}"></span>
      `).join('');

      dotsContainer.querySelectorAll('[data-step-dot]').forEach(dot => {
        dot.addEventListener('click', (e) => {
          const s = parseInt(e.currentTarget.dataset.stepDot, 10);
          this.renderStep(s);
        });
      });
    }

    // Position the spotlight box & popover tooltip
    this.positionSpotlightAndPopover(targetEl, step.placement);
  },

  positionSpotlightAndPopover(targetEl, preferredPlacement = 'bottom') {
    const spotlightBox = document.getElementById('tour-spotlight-box');
    const popover = document.getElementById('tour-popover-card');
    const arrow = document.getElementById('tour-arrow');

    if (!spotlightBox || !popover) return;

    let targetRect = null;
    if (targetEl && typeof targetEl.getBoundingClientRect === 'function') {
      try {
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      } catch (e) {}
      targetRect = targetEl.getBoundingClientRect();
    }

    // If target element is not found or has 0 size, default to center
    if (!targetRect || (targetRect.width === 0 && targetRect.height === 0)) {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      targetRect = { left: cx - 150, top: cy - 80, width: 300, height: 160, right: cx + 150, bottom: cy + 80 };
    }

    const pad = 6;
    const boxX = Math.max(0, targetRect.left - pad);
    const boxY = Math.max(0, targetRect.top - pad);
    const boxW = Math.max(24, targetRect.width + pad * 2);
    const boxH = Math.max(24, targetRect.height + pad * 2);

    spotlightBox.style.left = `${boxX}px`;
    spotlightBox.style.top = `${boxY}px`;
    spotlightBox.style.width = `${boxW}px`;
    spotlightBox.style.height = `${boxH}px`;
    spotlightBox.style.opacity = '1';

    // Popover placement
    const popW = 360;
    const popH = 220;
    const gap = 16;

    let popLeft = 0;
    let popTop = 0;
    let arrowCss = '';

    if (preferredPlacement === 'right') {
      popLeft = boxX + boxW + gap;
      popTop = boxY + boxH / 2 - popH / 2;
      arrowCss = `left: -6px; top: ${popH / 2 - 6}px; border-right: none; border-top: none;`;
      // If right overflows screen, flip to bottom or left
      if (popLeft + popW > window.innerWidth - 12) {
        popLeft = Math.max(12, boxX + boxW / 2 - popW / 2);
        popTop = boxY + boxH + gap;
        arrowCss = `top: -6px; left: 32px; border-bottom: none; border-right: none;`;
      }
    } else if (preferredPlacement === 'left') {
      popLeft = boxX - popW - gap;
      popTop = boxY + boxH / 2 - popH / 2;
      arrowCss = `right: -6px; top: ${popH / 2 - 6}px; border-left: none; border-bottom: none;`;
      // If left overflows
      if (popLeft < 12) {
        popLeft = Math.max(12, boxX + boxW / 2 - popW / 2);
        popTop = boxY + boxH + gap;
        arrowCss = `top: -6px; left: 32px; border-bottom: none; border-right: none;`;
      }
    } else if (preferredPlacement === 'bottom-left') {
      popLeft = boxX + boxW - popW;
      popTop = boxY + boxH + gap;
      arrowCss = `top: -6px; right: 28px; border-bottom: none; border-right: none;`;
    } else { // 'bottom'
      popLeft = boxX + boxW / 2 - popW / 2;
      popTop = boxY + boxH + gap;
      arrowCss = `top: -6px; left: ${popW / 2 - 6}px; border-bottom: none; border-right: none;`;
    }

    // Boundary constraints
    if (popLeft + popW > window.innerWidth - 16) {
      popLeft = window.innerWidth - popW - 16;
    }
    if (popLeft < 16) {
      popLeft = 16;
    }
    if (popTop + popH > window.innerHeight - 16) {
      popTop = Math.max(16, boxY - popH - gap);
      arrowCss = `bottom: -6px; left: ${popW / 2 - 6}px; border-top: none; border-left: none;`;
    }
    if (popTop < 16) {
      popTop = 16;
    }

    popover.style.left = `${popLeft}px`;
    popover.style.top = `${popTop}px`;
    popover.style.transform = 'none';

    if (arrow) {
      arrow.style.cssText = arrowCss;
    }
  },

  next() {
    this.renderStep(this.currentStep + 1);
  },

  prev() {
    this.renderStep(this.currentStep - 1);
  },

  finish() {
    this.cleanup();
  },

  skip() {
    this.cleanup();
  },

  cleanup() {
    this.isActive = false;
    const root = document.getElementById('tour-guide-root');
    if (root) {
      root.remove();
    }
    if (this.resizeListener) {
      window.removeEventListener('resize', this.resizeListener);
      this.resizeListener = null;
    }
    if (this.keyListener) {
      window.removeEventListener('keydown', this.keyListener);
      this.keyListener = null;
    }
  },

  bindEvents() {
    const closeBtn = document.getElementById('tour-close-btn');
    const nextBtn = document.getElementById('tour-next-btn');
    const prevBtn = document.getElementById('tour-prev-btn');

    if (closeBtn) closeBtn.onclick = () => this.skip();
    if (nextBtn) nextBtn.onclick = () => this.next();
    if (prevBtn) prevBtn.onclick = () => this.prev();

    this.resizeListener = () => {
      if (this.isActive) {
        this.renderStep(this.currentStep);
      }
    };
    window.addEventListener('resize', this.resizeListener);

    this.keyListener = (e) => {
      if (!this.isActive) return;
      if (e.key === 'Escape') {
        this.skip();
      } else if (e.key === 'ArrowRight' || e.key === 'Enter') {
        this.next();
      } else if (e.key === 'ArrowLeft') {
        this.prev();
      }
    };
    window.addEventListener('keydown', this.keyListener);
  }
};

        Toast.show(`Filtered lots for ${stationVal === 'ALL' ? 'All Stations' : stationVal} - ${monthVal} ${yearVal}`, 'info');

    }

    const createLotBtn = document.getElementById('btn-create-lot-modal');
    if (createLotBtn) {
      createLotBtn.addEventListener('click', () => PurchaseView.openCreateLotModal(tableInstance));

                  supplier: party,
                  description: desc,
                  amountInr: inr,
                  amountUsd: Math.round(inr / 83),
                  type: type,
                  status: 'POSTED'
                };

                txnsTable.setData(PurchaseView.commercialTxns);
                m.close();
                Toast.show(`Transaction ${newTxn.txnId} posted to general ledger.`, 'success');
              }
            }
          ]

    Modal.confirm({
      title: `Delete Lot ${lot.lotNumber}`,
      message: `Are you sure you want to delete Lot <strong>${lot.lotNumber}</strong> (${lot.species})? This will permanently remove its mass-balance ledger entry.`,
      confirmText: 'Delete Lot',
      isDestructive: true,
      onConfirm: () => {
        const idx = ERP_DATA.lots.findIndex(l => l.lotNumber === lot.lotNumber);
        if (idx > -1) {
          ERP_DATA.lots.splice(idx, 1);

    });

  deleteArrival(arrival, tableInstance) {
    const arrNo = arrival.arrivalNumber || arrival.id;
    Modal.confirm({
      title: `Delete Arrival ${arrNo}`,
      message: `Are you sure you want to remove raw material arrival record <strong>${arrNo}</strong>?`,
      confirmText: 'Delete Arrival',
      isDestructive: true,
      onConfirm: () => {
        const idx = this.rmArrivalsList.findIndex(a => (a.arrivalNumber === arrNo || a.id === arrNo));
        if (idx > -1) {
          const removed = this.rmArrivalsList.splice(idx, 1)[0];
          if (tableInstance) tableInstance.setData(this.rmArrivalsList);
          const badge = document.getElementById('rm-arrivals-count-badge');
          if (badge) badge.innerText = `${this.rmArrivalsList.length} Records`;

          // Confirmation Popup after delete
          Modal.success({
            title: 'Arrival Record Deleted',
            message: `Raw material arrival <strong>${arrNo}</strong> has been deleted from the database.`,
            details: [
              { label: 'Deleted Record', value: arrNo },
              { label: 'Plant', value: removed.plant || 'DFL UNIT-5' },
              { label: 'Removed Weight', value: `${(removed.weight || 0).toLocaleString()} KG` }
            ]
          });
          Toast.show(`Arrival ${arrNo} deleted.`, 'success');
        }
      }
    });
  },

  deleteArrivalRecord(arrival, tableInstance) {
    Modal.confirm({
      title: `Delete Arrival Record ${arrival.arrivalCode}`,
      message: `Are you sure you want to permanently delete inward arrival receipt <strong>${arrival.arrivalCode}</strong> (${arrival.netCatchKg} KG)?`,
      confirmText: 'Delete Record',
      isDestructive: true,
      onConfirm: () => {
        const idx = ERP_DATA.arrivals.findIndex(a => a.id === arrival.id);
        if (idx > -1) {
          ERP_DATA.arrivals.splice(idx, 1);
          if (tableInstance) tableInstance.setData(ERP_DATA.arrivals);

          // Confirmation Popup after delete
          Modal.success({
            title: 'Arrival Record Deleted',
            message: `Inward arrival receipt ${arrival.arrivalCode} has been deleted.`
          });
          Toast.show(`Arrival record ${arrival.arrivalCode} deleted successfully.`, 'success');
        }
      }
    });
  },

              advancePaid: '$ 0',
              status: 'CONFIRMED'
            };

            PurchaseView.bookingsList.unshift(newBooking);

            // Re-assign S.No

              b.sNo = idx + 1;
            });

            if (tableInstance) tableInstance.setData(PurchaseView.bookingsList);
            m.close();

            // Confirmation Popup after save
            Modal.success({
              title: 'Booking Saved Successfully',
              message: `Pre-harvest booking ${newBooking.bookingNo} has been saved and registered in the system.`,

              ]
            });

          }
        }
      ]
    });

  deleteBooking(booking, tableInstance) {

      title: `Delete Booking ${booking.bookingNo}`,
      message: `Are you sure you want to cancel and delete Booking <strong>${booking.bookingNo}</strong>?`,
      confirmText: 'Delete Booking',
      isDestructive: true,
      onConfirm: () => {
        const idx = PurchaseView.bookingsList.findIndex(b => b.bookingNo === booking.bookingNo);
        if (idx > -1) {
          PurchaseView.bookingsList.splice(idx, 1);
          PurchaseView.bookingsList.forEach((b, i) => { b.sNo = i + 1; });
          if (tableInstance) tableInstance.setData(PurchaseView.bookingsList);

          // Confirmation Popup after delete
          Modal.success({
            title: 'Booking Deleted Successfully',
            message: `Booking agreement ${booking.bookingNo} has been removed from the registry.`
          });
          Toast.show(`Booking ${booking.bookingNo} removed.`, 'success');
        }
      }
    });

  getFilteredUsers() {
    return ERP_DATA.users.filter(u => {
      if (this.activeFilter.searchTerm) {
        const t = this.activeFilter.searchTerm.toLowerCase();
        const matches = u.name.toLowerCase().includes(t) || u.email.toLowerCase().includes(t) || u.phone.includes(t) || u.id.toLowerCase().includes(t);
        if (!matches) return false;
      }
      if (this.activeFilter.role !== 'ALL' && u.role !== this.activeFilter.role) {
        return false;
      }
      if (this.activeFilter.department !== 'ALL' && u.department !== this.activeFilter.department) {
        return false;
      }
      if (this.activeFilter.status !== 'ALL' && u.status !== this.activeFilter.status) {
        return false;
      }
      return true;
    });
  },

  bindUsersTabEvents() {
    // Toggle Filter
    const toggleBtn = document.getElementById('users-toggle-filter-btn');
    const filterBody = document.getElementById('users-filter-body');
    const toggleText = document.getElementById('users-toggle-filter-text');
    if (toggleBtn && filterBody) {
      toggleBtn.onclick = () => {
        if (filterBody.classList.contains('hidden')) {
          filterBody.classList.remove('hidden');
          toggleText.innerText = 'Hide Filter';
        } else {
          filterBody.classList.add('hidden');
          toggleText.innerText = 'Show Filter';
        }
      };
    }

    // Filter Buttons
    const searchInput = document.getElementById('user-search-input');
    const roleFilter = document.getElementById('user-role-filter');
    const deptFilter = document.getElementById('user-dept-filter');
    const statusFilter = document.getElementById('user-status-filter');
    const applyBtn = document.getElementById('users-apply-filter-btn');
    const resetBtn = document.getElementById('users-reset-filter-btn');

    const triggerFilter = () => {
      this.activeFilter.searchTerm = searchInput?.value || '';
      this.activeFilter.role = roleFilter?.value || 'ALL';
      this.activeFilter.department = deptFilter?.value || 'ALL';
      this.activeFilter.status = statusFilter?.value || 'ALL';
      const container = document.getElementById('setup-subpage-content');
      if (container) this.renderUsersTab(container);
    };

    if (applyBtn) applyBtn.onclick = triggerFilter;
    if (searchInput) {
      searchInput.onkeydown = (e) => {
        if (e.key === 'Enter') triggerFilter();
      };
    }

    if (resetBtn) {
      resetBtn.onclick = () => {
        this.activeFilter = { searchTerm: '', role: 'ALL', department: 'ALL', plant: 'ALL', status: 'ALL' };
        const container = document.getElementById('setup-subpage-content');
        if (container) this.renderUsersTab(container);
      };
    }

    // Register New User
    const createBtn = document.getElementById('btn-create-user-modal');
    if (createBtn) {
      createBtn.onclick = () => this.showCreateUserModal();
    }

    // Toolbar Exports
    const copyBtn = document.getElementById('users-copy-btn');
    if (copyBtn) {
      copyBtn.onclick = () => {
        Toast.show('User Directory copied to clipboard (8 records)', 'info', 'Clipboard Export');
      };
    }

    const excelBtn = document.getElementById('users-excel-btn');
    if (excelBtn) {
      excelBtn.onclick = () => {
        Toast.show('Generating Devi_Fisheries_Users_List.xlsx...', 'success', 'Excel Export Ready');
      };
    }

    const pdfBtn = document.getElementById('users-pdf-btn');
    if (pdfBtn) {
      pdfBtn.onclick = () => {
        Toast.show('Generating Enterprise_User_Directory_Report.pdf...', 'success', 'PDF Ready');
      };
    }

    // Table Actions
    document.querySelectorAll('[data-action="view-user"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        const u = ERP_DATA.users.find(x => x.id === id);
        if (u) this.showUserDetailsDrawer(u);
      };
    });

    document.querySelectorAll('[data-action="edit-user"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        const u = ERP_DATA.users.find(x => x.id === id);
        if (u) this.showEditUserModal(u);
      };
    });

    document.querySelectorAll('[data-action="delete-user"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        const u = ERP_DATA.users.find(x => x.id === id);
        if (u) this.showDeleteUserModal(u);
      };
    });

    document.querySelectorAll('[data-action="toggle-status"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        const u = ERP_DATA.users.find(x => x.id === id);
        if (u) {
          u.status = u.status === 'Active' ? 'Inactive' : 'Active';
          Toast.show(`User account ${u.name} is now ${u.status}`, 'info', 'Status Updated');
          const container = document.getElementById('setup-subpage-content');
          if (container) this.renderUsersTab(container);
        }
      };
    });

                  <button data-action="edit-role" data-id="${r.id}" class="px-2 py-1 text-[#0052CC] hover:bg-[#DEEBFF] rounded font-semibold transition-colors cursor-pointer">
                    Edit
                  </button>
                  ${!r.isSystem ? `
                    <button data-action="delete-role" data-id="${r.id}" class="px-2 py-1 text-[#FF5630] hover:bg-[#FFEBE6] rounded font-semibold transition-colors cursor-pointer">

              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    this.bindRolesTabEvents();
  },

  bindRolesTabEvents() {
    const createBtn = document.getElementById('btn-create-role-modal');
    if (createBtn) {
      createBtn.onclick = () => this.showCreateRoleModal();
    }

    document.querySelectorAll('[data-action="edit-role"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        const r = ERP_DATA.roles.find(x => x.id === id);
        if (r) this.showEditRoleModal(r);
      };
    });

    document.querySelectorAll('[data-action="delete-role"]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.id;
        const r = ERP_DATA.roles.find(x => x.id === id);
        if (r) {
          const idx = ERP_DATA.roles.findIndex(x => x.id === id);
          if (idx !== -1) {
            ERP_DATA.roles.splice(idx, 1);
            Toast.show(`Role ${r.name} removed.`, 'success', 'Role Deleted');
            const container = document.getElementById('setup-subpage-content');
            if (container) this.renderRolesTab(container);
          }
        }
      };
    });
  },

  showCreateRoleModal() {
    Modal.open({
      title: 'Create New Security Role',
      size: 'md',
      content: `

          <div>

  // App Controller
  // Master Application Controller & Router for Fisheries ERP









// Views











const App = {
  init() {
    Toast.init();
    this.bindHashChange();
    this.route();
  },

  bindHashChange() {
    window.addEventListener('hashchange', () => this.route());
  },

  route() {
    const rawHash = window.location.hash || '';
    // If explicitly on login page
    if (rawHash === '#/login' || rawHash === '#/signin' || rawHash === '#login') {
      document.getElementById('app-root').innerHTML = `<div id="login-view-container"></div>`;
      LoginView.render('login-view-container');
      return;
    }

    // If empty hash, default to main dashboard
    if (rawHash === '' || rawHash === '#' || rawHash === '#/') {
      window.location.hash = '#/purchase/dashboard/rm-dashboard';
      return;
    }

    // Ensure main ERP shell is mounted
    this.ensureShellMounted();

    // Clean hash: remove leading # and /
    const clean = rawHash.replace(/^#\/?/, '').replace(/^\/+/, '');
    const parts = clean.split('/');
    const moduleName = parts[0] || 'purchase';
    let submenuName = parts[1] || '';
    let tabName = parts[2] || '';

    // Auto-resolve default module, submenu, and tab if missing or shorthand
    const modObj = NAV_HIERARCHY.find(m => m.id === moduleName) || NAV_HIERARCHY[0];
    let subObj = modObj.submenus.find(s => s.id === submenuName);
    if (!subObj) {
      // Check if parts[1] was actually a tab ID under one of the submenus
      for (const sm of modObj.submenus) {
        if (sm.tabs.some(t => t.id === submenuName)) {
          subObj = sm;
          tabName = submenuName;
          submenuName = sm.id;
          break;
        }
      }
      if (!subObj) {
        subObj = modObj.submenus[0];
        submenuName = subObj.id;
      }
    }
    if (!tabName) {
      tabName = subObj.defaultTab || subObj.tabs[0]?.id || '';
    }

    const resolvedHash = `#/${modObj.id}/${subObj.id}/${tabName}`;

    // Render Navigation Sidebar & Breadcrumbs
    Sidebar.render('sidebar-container', resolvedHash);
    Breadcrumbs.render('breadcrumbs-container', resolvedHash);

    const mainContainer = 'main-content-container';

    switch (modObj.id) {
      case 'purchase':
        PurchaseView.render(mainContainer, tabName || 'rm-dashboard', resolvedHash);
        break;
      case 'preprocessing':
        PreprocessingView.render(mainContainer, tabName || 'floor-overview', resolvedHash);
        break;
      case 'quality':
        QCView.render(mainContainer, tabName || 'qc-overview', resolvedHash);
        break;
      case 'production':
        ProductionView.render(mainContainer, tabName || 'overview', resolvedHash);
        break;
      case 'coldstore':
        ColdstoreView.render(mainContainer, tabName || 'overview', resolvedHash);
        break;
      case 'inventory':
        InventoryView.render(mainContainer, tabName || 'overview', resolvedHash);
        break;
      case 'sales':
        SalesView.render(mainContainer, tabName || 'overview', resolvedHash);
        break;
      case 'reports':
        ReportsView.render(mainContainer, tabName || 'yield-reports', resolvedHash);
        break;
      case 'setup':
        SetupView.render(mainContainer, tabName || 'users', resolvedHash);
        break;
      default:
        PurchaseView.render(mainContainer, 'rm-dashboard', '#/purchase/dashboard/rm-dashboard');
        break;
    }

    // Scroll to top of main content
    const mainEl = document.getElementById(mainContainer);
    if (mainEl) mainEl.scrollTop = 0;

    // Check if Onboarding Tour should start (e.g. after login)
    if (sessionStorage.getItem('trigger_tour_on_login') === 'true') {
      sessionStorage.removeItem('trigger_tour_on_login');
      setTimeout(() => {
        TourGuide.start();
      }, 500);
    }
  },

  ensureShellMounted() {
    const existing = document.getElementById('erp-app-shell');
    if (!existing) {
      document.getElementById('app-root').innerHTML = `
        <div id="erp-app-shell" class="min-h-screen bg-[#F4F5F7]">
          <!-- Left Fixed Sidebar (Spacious 288px width to prevent dropdown cutoff) -->
          <div id="sidebar-container" class="fixed top-0 left-0 bottom-0 w-72 z-40 transition-all duration-300"></div>

          <!-- Main Layout Wrapper (offset by fixed sidebar width) -->
          <div id="main-layout-wrapper" class="ml-72 flex flex-col min-h-screen transition-all duration-300">
            <!-- Top Sticky Header -->
            <div id="header-container" class="sticky top-0 z-30 bg-white"></div>

            <!-- Breadcrumbs Bar -->
            <div class="px-6 py-2 bg-white border-b border-[#DFE1E6] flex items-center justify-between sticky top-14 z-20 shadow-2xs">
              <div id="breadcrumbs-container"></div>
            </div>

            <!-- Module Subview Injected Here (Full-Width Responsive UI) -->
            <main id="main-content-container" class="p-6 flex-1 w-full"></main>
          </div>
        </div>
      `;

      // Mount Header
      Header.render('header-container');
    }
  },

  // GLOBAL SEARCH MODAL
  openGlobalSearchModal() {
    Modal.open({
      title: 'Global Search across Fisheries ERP',
      size: 'lg',
      content: `
        <div class="space-y-4">
          <!-- Search Input -->
          <div class="relative">
            <input 
              type="text" 
              id="modal-global-search-input" 
              placeholder="Type Lot number, Arrival No, Booking PB, Supplier, Bill No..." 
              autofocus 
              class="w-full text-sm pl-10 pr-4 py-2.5 bg-[#FAFBFC] border-2 border-[#0052CC] rounded-lg focus:outline-none"
            />
            <svg class="w-5 h-5 text-[#0052CC] absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </div>

          <!-- Dynamic Search Results -->
          <div id="global-search-results" class="max-h-96 overflow-y-auto space-y-4 text-xs">
            ${this.renderInitialSearchResults()}
          </div>
        </div>
      `,
      footerButtons: [
        { label: 'Close (Esc)', type: 'secondary', onClick: (m) => m.close() }
      ]
    });

    setTimeout(() => {
      const input = document.getElementById('modal-global-search-input');
      const resultsContainer = document.getElementById('global-search-results');
      if (input && resultsContainer) {
        input.focus();
        input.addEventListener('input', (e) => {
          resultsContainer.innerHTML = this.performGlobalSearch(e.target.value);
          this.bindSearchResultClicks();
        });
      }
      this.bindSearchResultClicks();
    }, 50);
  },

  renderInitialSearchResults() {
    return `
      <div>
        <div class="text-[10px] font-bold text-[#6B778C] uppercase tracking-wider mb-2">Suggested Quick Searches</div>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
          <button class="search-preset-btn p-2 bg-[#FAFBFC] hover:bg-[#DEEBFF] border border-[#DFE1E6] rounded text-left transition-colors" data-term="LOT-2026">
            <span class=" font-bold text-[#0052CC]">LOT-2026-00125</span>
            <div class="text-[10px] text-[#5E6C84]">Vannamei Shrimp Traceability</div>
          </button>
          <button class="search-preset-btn p-2 bg-[#FAFBFC] hover:bg-[#DEEBFF] border border-[#DFE1E6] rounded text-left transition-colors" data-term="RMA-2026">
            <span class=" font-bold text-[#36B37E]">RMA-2026-00341</span>
            <div class="text-[10px] text-[#5E6C84]">Today's Fresh Dock Arrival</div>
          </button>
          <button class="search-preset-btn p-2 bg-[#FAFBFC] hover:bg-[#DEEBFF] border border-[#DFE1E6] rounded text-left transition-colors" data-term="BILL-2026">
            <span class=" font-bold text-[#6554C0]">BILL-2026-118</span>
            <div class="text-[10px] text-[#5E6C84]">Godavari Aqua Invoice</div>
          </button>
        </div>
      </div>
    `;
  },

  performGlobalSearch(term) {
    if (!term || term.trim() === '') {
      return this.renderInitialSearchResults();
    }

    const t = term.toLowerCase();

    // Search in Lots
    const matchingLots = ERP_DATA.lots.filter(l => 
      l.lotNumber.toLowerCase().includes(t) || 
      l.species.toLowerCase().includes(t) || 
      l.supplierName.toLowerCase().includes(t)
    );

    // Search in Arrivals
    const matchingArrivals = ERP_DATA.rmArrivals.filter(a => 
      a.arrivalNumber.toLowerCase().includes(t) || 
      a.supplierName.toLowerCase().includes(t) || 
      a.vehicleNumber.toLowerCase().includes(t)
    );

    // Search in Supplier Bills
    const matchingBills = ERP_DATA.supplierBills.filter(b => 
      b.billNo.toLowerCase().includes(t) || 
      b.supplierName.toLowerCase().includes(t)
    );

    let html = '';

    if (matchingLots.length > 0) {
      html += `
        <div>
          <div class="text-[10px] font-bold text-[#0052CC] uppercase tracking-wider mb-1">Purchase Lots (${matchingLots.length})</div>
          <div class="divide-y divide-[#EBECF0] border border-[#DFE1E6] rounded-lg overflow-hidden bg-white">
            ${matchingLots.map(l => `
              <div class="p-2.5 hover:bg-[#FAFBFC] flex items-center justify-between cursor-pointer search-result-item" data-action="trace-lot" data-key="${l.lotNumber}">
                <div>
                  <div class=" font-bold text-[#0052CC]">${l.lotNumber} - ${l.species}</div>
                  <div class="text-[11px] text-[#5E6C84]">${l.supplierName} • Landing: ${l.landingSource}</div>
                </div>
                <div class="text-right">
                  <div class=" font-bold text-[#172B4D]">${l.receivedQtyKg.toLocaleString()} KG</div>
                  <span class="lozenge lozenge-success text-[10px]">${l.lotStatus}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    if (matchingArrivals.length > 0) {
      html += `
        <div>
          <div class="text-[10px] font-bold text-[#36B37E] uppercase tracking-wider mb-1">Raw Material Arrivals (${matchingArrivals.length})</div>
          <div class="divide-y divide-[#EBECF0] border border-[#DFE1E6] rounded-lg overflow-hidden bg-white">
            ${matchingArrivals.map(a => `
              <div class="p-2.5 hover:bg-[#FAFBFC] flex items-center justify-between cursor-pointer search-result-item" data-action="nav" data-hash="#/purchase/operations/rm-arrivals">
                <div>
                  <div class=" font-bold text-[#36B37E]">${a.arrivalNumber} - ${a.species}</div>
                  <div class="text-[11px] text-[#5E6C84]">${a.supplierName} • Vehicle: ${a.vehicleNumber}</div>
                </div>
                <div class="text-right">
                  <div class=" font-bold text-[#172B4D]">${a.netWeightKg.toLocaleString()} KG</div>
                  <span class="lozenge lozenge-inprogress text-[10px]">${a.receivingStatus}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    if (matchingBills.length > 0) {
      html += `
        <div>
          <div class="text-[10px] font-bold text-[#6554C0] uppercase tracking-wider mb-1">Supplier Bills (${matchingBills.length})</div>
          <div class="divide-y divide-[#EBECF0] border border-[#DFE1E6] rounded-lg overflow-hidden bg-white">
            ${matchingBills.map(b => `
              <div class="p-2.5 hover:bg-[#FAFBFC] flex items-center justify-between cursor-pointer search-result-item" data-action="nav" data-hash="#/purchase/transactions-bills/supplier-bills">
                <div>
                  <div class=" font-bold text-[#6554C0]">${b.billNo} - ${b.supplierName}</div>
                  <div class="text-[11px] text-[#5E6C84]">Lot: ${b.lotNumber} • Due: ${b.dueDate}</div>
                </div>
                <div class="text-right">
                  <div class=" font-bold text-[#006644]">₹ ${b.totalAmountInr.toLocaleString()}</div>
                  <span class="lozenge lozenge-warning text-[10px]">${b.status}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    if (html === '') {
      html = `
        <div class="text-center py-8 text-[#6B778C]">
          No ERP records matched "<strong>${term}</strong>". Try searching for <code>LOT</code>, <code>RMA</code>, or <code>GODAVARI</code>.
        </div>
      `;
    }

    return html;
  },

  bindSearchResultClicks() {
    document.querySelectorAll('.search-preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const term = btn.dataset.term;
        const input = document.getElementById('modal-global-search-input');
        if (input) {
          input.value = term;
          input.dispatchEvent(new Event('input'));
        }
      });
    });

    document.querySelectorAll('.search-result-item').forEach(item => {
      item.addEventListener('click', () => {
        const action = item.dataset.action;
        Modal.close();

        if (action === 'trace-lot') {
          const lotKey = item.dataset.key;
          const lot = ERP_DATA.lots.find(l => l.lotNumber === lotKey);
          if (lot) {
            window.location.hash = '#/purchase/operations/lot-tracking';
            setTimeout(() => PurchaseView.showLotTraceabilityDrawer(lot), 200);
          }
        } else if (action === 'nav') {
          const hash = item.dataset.hash;
          if (hash) window.location.hash = hash;
        }
      });
    });
  }
};

// Auto boot on DOM load or immediately if already ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => App.init());
} else {
  App.init();
}

})();

  </script>
</body>
</html>
